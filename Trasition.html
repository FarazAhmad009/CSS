<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trasitions Css</title>
    <Style>
        div{
            margin: 300px 200px 100px 200px;
            width: 100px;
            height: 100px;
            background-color: red;
            transition: width 2s, height 2s, background-color 2s, transform 2s, border-radius 2s ease-out;
        }
        div:hover{
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: blue;
            transform: rotate(180deg);
        }
    </Style>
</head>
<body>
    <div>

    </div>
</body>
</html>
