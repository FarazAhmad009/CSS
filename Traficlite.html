<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic lite</title>
    <style>
        *{
            margin: 0;
            height: 0;
        }
        .outer{
            height: 97vh;
            width: 98vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .trafic {
            background-color: antiquewhite;
            height: 300px;
            width: 90px;
            border: 2px solid black;
            display: flex;
            flex-direction: column;
            gap: 40px;
            justify-content: center;
            align-items: center;
        }

        .box-1 {
            background-color: red;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            /* margin: auto; */

        }

        .box-2 {
            background-color: yellow;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            /* margin: 30px auto; */
        }

        .box-3 {
            background-color: green;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            /* margin: auto; */
        }
    </style>
</head>

<body>
    <div class="outer">
        <div class="trafic">
            <div class="box-1"></div>
            <div class="box-2"></div>
            <div class="box-3"></div>
        </div>
    </div>
</body>

</html>
