<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback rating Form</title>
</head>

<body>
    <form action="/action">
        <h1>Feedback Form</h1>
        <label for="Name"><b>Name:</b></label>
        <input type="text" id="Name" name="Fn" placeholder="Write your Name">
        <br><br>
        <label for="email"><b>Email:</b></label>
        <input type="email" id="email" name="emil" placeholder="Write your Email">
        <br><br>
        <label for="Text Area"><b>Message:</b></label>
        <br>
        <textarea name="feedback" id="Text Area" rows="5" cols="35"></textarea>
        <br><br>
        <b>Rate us our of 5:</b>
        <br>
        <input type="radio" name="rating" value="1" id="One">
        <label for="One">1</label>
        <br>
        <input type="radio" name="rating" value="2" id="Two">
        <label for="Two">2</label>
        <br>
        <input type="radio" name="rating" value="3" id="three">
        <label for="three">3</label>
        <br>
        <input type="radio" name="rating" value="4" id="four">
        <label for="four">4</label>
        <br>
        <input type="radio" name="rating" value="5" id="five">
        <label for="five">5</label>
        <br><br>
        <button>Send your message</button>
    </form>
</body>

</html>
